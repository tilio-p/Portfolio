<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>eikon parcel starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="l-dessin">
    <div class="container">
      <div class="row">
        <div class="col-8 offset-2">
          <h1>dessins</h1>
        </div>
        <div class="col-2">
          <div class="homebox">
            <a class="home" href="index.html">xmark</a>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="l-book">
        <div class="row">
          <div class="col-2 offset-2">
            <a class="navbutton navpre">Precedent</a>
          </div>
          <div class="col-4"></div>
          <div class="col-2">
            <a class="navbutton navnext">Suivant</a>
          </div>
        </div>

        <div class="l-slider">
          <div class="swiper-container">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <div class="contenu">
                  <img
                    src="Image/selection/dessins/souris.jpg"
                    alt="Dessin souris"
                  />
                  <extends
                    src="cardraw.html"
                    locals='{
                    "title":"Souris",
                    "date":"21 mai 2024",
                    "legende":"Crayon soluble, papier canson"
                  }'
                  ></extends>
                </div>
              </div>

              <div class="swiper-slide">
                <div class="contenu">
                  <img
                    src="Image/selection/dessins/droide.jpg"
                    alt="Dessin droïde"
                  />
                  <extends
                    src="cardraw.html"
                    locals='{
                    "title":"Back to Wild",
                    "date":"15 avril 2020",
                    "legende":"Bic et feutre à alcool"
                  }'
                  ></extends>
                </div>
              </div>

              <div class="swiper-slide">
                <div class="contenu">
                  <img
                    src="Image/selection/dessins/couchersoleil.jpg"
                    alt="Coucher de soleil"
                  />
                  <extends
                    src="cardraw.html"
                    locals='{
                    "title":"Coucher de soleil",
                    "date":"10 janvier 2023",
                    "legende":"Crayon soluble, papier canson"
                  }'
                  ></extends>
                </div>
              </div>

              <div class="swiper-slide">
                <div class="contenu">
                  <img
                    src="Image/selection/dessins/autriche.jpg"
                    alt="Paysage autrichien"
                  />
                  <extends
                    src="cardraw.html"
                    locals='{
                    "title":"Autriche",
                    "date":"23 juillet 2022",
                    "legende":"Crayon soluble, papier canson"
                  }'
                  ></extends>
                </div>
              </div>

              <div class="swiper-slide">
                <div class="contenu">
                  <img
                    src="Image/selection/dessins/crayon-1.jpg"
                    alt="Portrait au crayon"
                  />
                  <extends
                    src="cardraw.html"
                    locals='{
                    "title":"Portrait",
                    "date":"3 septembre 2023",
                    "legende":"Crayon soluble, papier canson"
                  }'
                  ></extends>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="row">
        <div class="col-12">
          <div class="footerblack">
            <extends src="footer.html"></extends>
          </div>
        </div>
      </div>
    </div>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
